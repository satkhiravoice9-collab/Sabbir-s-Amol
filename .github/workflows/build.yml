name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Prepare Android Project & Auto-Fix Package Path
      run: |
        # 1. সঠিক প্যাকেজ ডিরেক্টরি তৈরি
        mkdir -p app/src/main/java/com/sabbir/amol
        mkdir -p app/src/main/res/values
        mkdir -p app/src/main/assets

        # 2. MainActivity.kt ফাইল সঠিক প্যাকেজে তৈরি/ওভাররাইট
        cat << 'EOF' > app/src/main/java/com/sabbir/amol/MainActivity.kt
        package com.sabbir.amol

        import android.annotation.SuppressLint
        import android.os.Bundle
        import android.webkit.WebChromeClient
        import android.webkit.WebSettings
        import android.webkit.WebView
        import android.webkit.WebViewClient
        import androidx.activity.OnBackPressedCallback
        import androidx.appcompat.app.AppCompatActivity

        class MainActivity : AppCompatActivity() {
            private lateinit var webView: WebView

            @SuppressLint("SetJavaScriptEnabled")
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                webView = WebView(this)
                setContentView(webView)

                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.databaseEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                settings.loadWithOverviewMode = true
                settings.useWideViewPort = true

                webView.webViewClient = WebViewClient()
                webView.webChromeClient = WebChromeClient()
                webView.loadUrl("file:///android_asset/index.html")

                onBackPressedDispatcher.addCallback(this, object : OnBackPressedCallback(true) {
                    override fun handleOnBackPressed() {
                        if (webView.canGoBack()) {
                            webView.goBack()
                        } else {
                            isEnabled = false
                            onBackPressedDispatcher.onBackPressed()
                        }
                    }
                })
            }
        }
        EOF

        # 3. settings.gradle তৈরি
        cat << 'EOF' > settings.gradle
        pluginManagement {
            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }
        dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
            repositories {
                google()
                mavenCentral()
            }
        }
        rootProject.name = "Sabbir-s-Amol"
        include ':app'
        EOF

        # 4. root build.gradle
        cat << 'EOF' > build.gradle
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.2.2'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.22'
            }
        }
        allprojects {
            repositories {
                google()
                mavenCentral()
            }
        }
        EOF

        # 5. app/build.gradle
        cat << 'EOF' > app/build.gradle
        apply plugin: 'com.android.application'
        apply plugin: 'kotlin-android'

        android {
            namespace 'com.sabbir.amol'
            compileSdk 34

            defaultConfig {
                applicationId "com.sabbir.amol"
                minSdk 24
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_17
                targetCompatibility JavaVersion.VERSION_17
            }

            kotlinOptions {
                jvmTarget = '17'
            }
        }

        dependencies {
            implementation 'androidx.core:core-ktx:1.12.0'
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'com.google.android.material:material:1.11.0'
            implementation 'androidx.activity:activity-ktx:1.8.2'
        }
        EOF

        # 6. Themes & Strings XML
        cat << 'EOF' > app/src/main/res/values/themes.xml
        <resources>
            <style name="Theme.SabbirsAmol" parent="Theme.AppCompat.Light.NoActionBar" />
        </resources>
        EOF

        cat << 'EOF' > app/src/main/res/values/strings.xml
        <resources>
            <string name="app_name">Sabbir\'s Amol</string>
        </resources>
        EOF

        # 7. AndroidManifest.xml
        cat << 'EOF' > app/src/main/AndroidManifest.xml
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <application
                android:allowBackup="true"
                android:label="@string/app_name"
                android:supportsRtl="true"
                android:theme="@style/Theme.SabbirsAmol">
                <activity
                    android:name="com.sabbir.amol.MainActivity"
                    android:exported="true">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF

        # 8. Gradle Wrapper তৈরি
        gradle wrapper --gradle-version 8.2
        chmod +x gradlew

    - name: Build APK with Gradle
      run: ./gradlew assembleDebug --no-daemon

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Sabbirs-Amol-APK
        path: app/build/outputs/apk/debug/*.apk
